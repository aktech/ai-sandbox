name: image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'main.go'
      - '.github/workflows/image.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'main.go'
      - '.github/workflows/image.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build aisb
        run: go build -trimpath -ldflags='-s -w' -o bin/aisb .
      - name: Build image with aisb
        run: ./bin/aisb build
      - name: Show image
        run: docker images ai-sandbox-pi:latest
